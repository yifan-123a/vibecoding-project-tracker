spring:
  # Hosted demo: the disk is ephemeral, so keep the database in memory and let
  # SeedData rebuild the eight demo tasks on every boot. Same data every time.
  datasource:
    url: jdbc:h2:mem:vibetracker;DB_CLOSE_DELAY=-1
  thymeleaf:
    cache: true
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    root: INFO
