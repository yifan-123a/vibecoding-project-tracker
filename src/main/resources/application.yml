server:
  port: 8080
  servlet:
    session:
      # Flash messages need a session; keep it in a cookie so the ;jsessionid
      # never shows up in a redirect URL.
      tracking-modes: cookie

spring:
  application:
    name: vibetracker
  datasource:
    url: jdbc:h2:file:./data/vibetracker;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
